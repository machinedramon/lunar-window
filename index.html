<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#000000" />
    <meta
      name="description"
      content="Lunar Window: a landing-window planner for the lunar south pole. See the Sun and the Earth against the real NASA LOLA terrain, and find which sites and days still work when a launch slips."
    />
    <meta property="og:title" content="Lunar Window — when the launch slips, see what still works" />
    <meta property="og:description" content="A landing-window planner for the lunar south pole, built on NASA LOLA terrain and checked against NASA JPL Horizons." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="https://machinedramon.github.io/lunar-window/og.jpg" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="ai-disclosure" content="Most of the code, tests and documentation of this project were generated with an AI coding assistant (a large language model), under the direction of the team member, who chose among the options proposed, set the direction and reviewed the work. Numerical results were validated against NASA data. Nothing in the tool is an AI-generated image, video or sound; the narration of the demo video is an AI-generated voice." />
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <title>Lunar Window — landing-window planner for the lunar south pole</title>
  </head>
  <body>
    <!-- The opening: drawn by the page itself, before any script. The mark; then the name, a line that fills with
         the real stages of the loading, and the name of the stage; and when the first view is whole the screen
         opens like a window, from the mark outwards. It moves on the compositor, so it stays fluid while the
         terrain and the models are being prepared. -->
    <div id="intro" role="status" aria-label="Loading Lunar Window">
      <svg class="intro-mark" viewBox="0 0 40 40" aria-hidden="true"><defs><clipPath id="intro-c"><circle cx="20" cy="20" r="17" /></clipPath></defs><circle cx="20" cy="20" r="17" fill="#000" stroke="#fff" stroke-width="1.2" /><g clip-path="url(#intro-c)"><circle cx="24.5" cy="22" r="4.6" fill="#fff" /><path d="M0 27 L7 23.5 L12 25.5 L17 21 L22 24.5 L28 22 L33 25 L40 23 L40 40 L0 40 Z" fill="#8f8f96" /><path d="M0 31 L9 28 L15 30 L23 27.5 L31 30 L40 28 L40 40 L0 40 Z" fill="#2a2a2d" /></g></svg>
      <div class="intro-text">
        <b class="intro-name">Lunar Window</b>
        <span class="intro-bar" aria-hidden="true"><i></i></span>
        <span class="intro-stage"></span>
      </div>
    </div>
    <style>
      @property --intro-hole { syntax: '<length>'; inherits: false; initial-value: 0px; }
      html { background: #000; }
      #intro { position: fixed; inset: 0; z-index: 9999; background: #000; color: #fff; overflow: hidden;
        -webkit-mask: radial-gradient(circle at 50% 44%, transparent var(--intro-hole), #000 calc(var(--intro-hole) + 1.5px));
        mask: radial-gradient(circle at 50% 44%, transparent var(--intro-hole), #000 calc(var(--intro-hole) + 1.5px));
        transition: --intro-hole 1.25s cubic-bezier(0.7, 0, 0.2, 1), opacity 0.5s ease 0.85s, visibility 0s 1.4s; }
      /* the window opens: from the mark outwards */
      #intro.out { --intro-hole: 130vmax; opacity: 0; visibility: hidden; pointer-events: none; }
      .intro-mark { position: absolute; left: 50%; top: 44%; width: 76px; height: 76px; margin: -38px 0 0 -38px; animation: intro-in 0.9s ease both; transition: transform 1.1s cubic-bezier(0.7, 0, 0.2, 1), opacity 0.5s ease; }
      #intro.out .intro-mark { transform: scale(2.6); opacity: 0; }
      @keyframes intro-in { from { opacity: 0; } }
      /* the name and the stages: they come in once the type is loaded, so that no letter changes shape on screen */
      .intro-text { position: absolute; left: 0; right: 0; top: calc(44% + 78px); display: grid; justify-items: center; gap: 14px; opacity: 0; transform: translateY(8px); transition: opacity 0.9s ease, transform 0.9s cubic-bezier(0.2, 0.7, 0.2, 1); }
      #intro.typed .intro-text { opacity: 1; transform: none; }
      #intro.out .intro-text { opacity: 0; transition-duration: 0.35s; }
      .intro-name { font: 500 30px/1 'Jost Variable', sans-serif; letter-spacing: 0.42em; margin-right: -0.42em; text-transform: uppercase; white-space: nowrap; }
      .intro-bar { display: block; width: 168px; height: 1px; margin-top: 10px; background: rgba(255, 255, 255, 0.16); overflow: hidden; }
      .intro-bar i { display: block; width: 100%; height: 100%; background: #fff; transform-origin: 0 50%; transform: scaleX(0.04); transition: transform 0.6s cubic-bezier(0.2, 0.7, 0.2, 1); }
      .intro-stage { min-height: 22px; max-width: 86vw; font: 400 15px/22px 'Jost Variable', sans-serif; letter-spacing: 0.02em; color: rgba(255, 255, 255, 0.76); text-align: center; text-wrap: balance; transition: opacity 0.22s ease; }
      .intro-stage.swap { opacity: 0; }
      @media (max-width: 520px) { .intro-name { font-size: 21px; } }
      @media (prefers-reduced-motion: reduce) { #intro { transition: opacity 0.4s ease, visibility 0s 0.4s; } }
    </style>
    <script type="module" src="/src/main.ts"></script>
    <noscript><style>#intro { display: none; }</style>Lunar Window needs JavaScript to compute the positions of the Sun and the Earth in your browser.</noscript>
  </body>
</html>
