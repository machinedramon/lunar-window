<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#000000" />
    <meta
      name="description"
      content="Lunar Window: a landing-window planner for the lunar south pole. See the Sun and the Earth against the real NASA LOLA terrain, and find which sites and days still work when a launch slips."
    />
    <meta property="og:title" content="Lunar Window — when the launch slips, see what still works" />
    <meta property="og:description" content="A landing-window planner for the lunar south pole, built on NASA LOLA terrain and checked against NASA JPL Horizons." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="https://machinedramon.github.io/lunar-window/og.jpg" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="ai-disclosure" content="Most of the code, tests and documentation of this project were generated with an AI coding assistant (a large language model), under the direction of the team member, who chose among the options proposed, set the direction and reviewed the work. Numerical results were validated against NASA data. Nothing in the tool is an AI-generated image or video; the voice of the guided first landing and the narration of the demo video are AI-generated voices (OpenAI text-to-speech)." />
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <title>Lunar Window — landing-window planner for the lunar south pole</title>
  </head>
  <body>
    <!-- The opening: drawn by the page itself, before any script. Black; across the middle a thin line that
         fills, from its middle, with the real stages of the loading; above it, one after the other, the few
         sentences of the problem the tool answers; under it, small, the mark and the name. When the first view
         is whole the dark opens along the line, like a visor. The guide's own opening, which follows, is the
         same dark with the same line: one runs into the other. It moves on the compositor, so it stays fluid
         while the terrain and the models are being prepared.
         The mark: a round window, the horizon of the Moon across it, and the Earth just above the horizon,
         the one thing in colour. -->
    <div id="intro" role="status" aria-label="Loading Lunar Window">
      <p class="intro-stage"></p>
      <span class="intro-bar" aria-hidden="true"><i></i></span>
      <div class="intro-brand">
        <svg class="intro-mark" viewBox="0 0 40 40" aria-hidden="true"><circle cx="20" cy="20" r="16.5" fill="none" stroke="#fff" stroke-width="1.5"/><path d="M5.1 27H34.9" stroke="#fff" stroke-width="1.5"/><circle cx="25.5" cy="21.6" r="3.1" fill="#7db8ff"/></svg>
        <b class="intro-name">Lunar Window</b>
      </div>
    </div>
    <style>
      @property --intro-visor { syntax: '<percentage>'; inherits: false; initial-value: 50%; }
      html, body { background: #000; }
      #intro { position: fixed; inset: 0; z-index: 9999; background: #000; color: #fff; overflow: hidden;
        -webkit-mask: linear-gradient(#000 0 0) top / 100% var(--intro-visor) no-repeat, linear-gradient(#000 0 0) bottom / 100% var(--intro-visor) no-repeat;
        mask: linear-gradient(#000 0 0) top / 100% var(--intro-visor) no-repeat, linear-gradient(#000 0 0) bottom / 100% var(--intro-visor) no-repeat;
        transition: --intro-visor 1.05s cubic-bezier(0.7, 0, 0.2, 1) 0.2s, opacity 0.3s ease 1.2s, visibility 0s 1.5s; }
      /* The dark opens along its line: the two halves draw back to the top and the bottom edge; what is written goes first. */
      #intro.out { --intro-visor: 0%; opacity: 0; visibility: hidden; pointer-events: none; }
      #intro > * { transition: opacity 0.35s ease; }
      #intro.out > * { opacity: 0; }
      /* the line, at the middle of the screen: it fills from its middle as the loading goes */
      .intro-bar { position: absolute; left: 50%; top: 50%; width: min(560px, 62vw); height: 1px; margin-left: calc(min(560px, 62vw) / -2); background: rgba(255, 255, 255, 0.2); overflow: hidden; animation: intro-in 1.2s ease both; }
      .intro-bar i { display: block; width: 100%; height: 100%; background: rgba(255, 255, 255, 0.85); transform: scaleX(0.04); transition: transform 0.9s cubic-bezier(0.2, 0.7, 0.2, 1); }
      @keyframes intro-in { from { opacity: 0; } }
      /* the sentences, above the line; the mark and the name, under it. They come in once the typeface is there. */
      .intro-stage { position: absolute; left: 24px; right: 24px; bottom: calc(50% + 34px); margin: 0; min-height: 1.25em; font: 300 clamp(21px, 2.5vw, 31px) / 1.25 'Jost Variable', sans-serif; letter-spacing: 0.035em; text-align: center; text-wrap: balance; color: rgba(255, 255, 255, 0.92); opacity: 0; }
      .intro-brand { position: absolute; left: 0; right: 0; top: calc(50% + 30px); display: flex; align-items: center; justify-content: center; gap: 12px; opacity: 0; }
      #intro.typed .intro-stage { opacity: 1; transition: opacity 0.9s ease; }
      #intro.typed .intro-brand { opacity: 1; transition: opacity 1.2s ease 0.3s; }
      #intro.typed .intro-stage.swap { opacity: 0; transition: opacity 0.42s ease; }
      #intro.out .intro-stage, #intro.out .intro-brand { opacity: 0; transition: opacity 0.35s ease; }
      .intro-mark { width: 17px; height: 17px; opacity: 0.9; }
      .intro-name { font: 500 10.5px/1 'Jost Variable', sans-serif; letter-spacing: 0.46em; margin-right: -0.46em; text-transform: uppercase; white-space: nowrap; color: rgba(255, 255, 255, 0.62); }
      @media (prefers-reduced-motion: reduce) { #intro { transition: opacity 0.4s ease, visibility 0s 0.4s; } }
    </style>
    <script type="module" src="/src/main.ts"></script>
    <noscript><style>#intro { display: none; }</style>Lunar Window needs JavaScript to compute the positions of the Sun and the Earth in your browser.</noscript>
  </body>
</html>
